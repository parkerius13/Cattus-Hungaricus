<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cattus Hungaricus</title><style> *{box-sizing:border-box}body{font:17px system-ui;margin:0;background:#f5f3eb;color:#20382e}main{max-width:800px;margin:auto;padding:20px}header{background:#234b3b;color:white;padding:22px}button,select,input{font:inherit;padding:12px;border:1px solid #81988a;border-radius:9px;background:transparent;color:inherit}button{cursor:pointer;margin:4px}button:hover{background:#b8cdbb;color:#152c20}nav{display:flex;flex-wrap:wrap}article{border:1px solid #a7b6aa;border-radius:12px;padding:20px;margin:14px 0}h2{margin-top:0}small{opacity:.8} .dark{background:#17241e;color:#e5eee6}.ink{background:white;color:black} .answer{display:block;width:100%;text-align:left}progress{width:100%;accent-color:#397653}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #aaa;padding:8px;text-align:left} </style><header><h1>🐈 Cattus Hungaricus</h1>Latin nyelvtanulás magyarul</header><main><nav id="nav"></nav><div id="view"></div></main><script>
const lessons=[
['Alapok','A latin mondat szórendje viszonylag szabad. Az alany rendszerint nominativusban, a közvetlen tárgy accusativusban áll. A személyrag gyakran önmagában jelzi az alanyt.','Puella rosam portat. – A lány rózsát visz.','rosam','Accusativus','Nominativus','Dativus'],
['I. declinatio','Többnyire nőnemű főnevek. Egyes szám: -a, -ae, -ae, -am, -ā; többes szám: -ae, -arum, -is, -as, -is. Sorrend: nominativus, genitivus, dativus, accusativus, ablativus.','Puellae rosam do. – Rózsát adok a lánynak.','puellae (ebben a mondatban)','Dativus','Accusativus','Ablativus'],
['II. declinatio','A dominus mintája: -us, -i, -o, -um, -o; többes: -i, -orum, -is, -os, -is. A bellum semlegesnemű: nominativusa és accusativusa azonos, többesben -a.','Servus dominum videt. – A szolga látja az urat.','dominum','Accusativus','Genitivus','Nominativus'],
['III. declinatio','A rex, regis (király) mintája: rex, regis, regi, regem, rege; többes: reges, regum, regibus, reges, regibus. Az i-tövű szavak eltérhetnek.','Litterae regis adsunt. – A király levelei itt vannak.','regis','Genitivus','Dativus','Accusativus'],
['IV–V. declinatio','Manus, manus (kéz): manus, manus, manui, manum, manu. Res, rei (dolog): res, rei, rei, rem, re.','Rem video. – Látom a dolgot.','rem','Accusativus','Dativus','Ablativus'],
['Melléknevek','A melléknév nemben, számban és esetben egyezik a főnévvel. Bonus, bona, bonum az I–II. declinatiót követi.','Bonam terram videt. – Jó földet lát.','bonam','Accusativus','Genitivus','Nominativus'],
['Igeragozás','A négy coniugatio infinitivusa: amare, monēre, legere, audire. Praesens activum személyragjai: -o/-m, -s, -t, -mus, -tis, -nt.','Litteras scribimus. – Leveleket írunk.','scribimus','Többes szám 1. személy','Egyes szám 3. személy','Többes szám 3. személy'],
['Igeidők','Imperfectum: folyamatos múlt (amabam); perfectum: befejezett múlt (amavi); plusquamperfectum: előidejű múlt (amaveram).','Rex venit. – A király megérkezett (a szövegkörnyezettől függően jelen is lehet).','amaveram','Plusquamperfectum','Imperfectum','Futurum'],
['Coniunctivus','A kötőmód többek között célhatározói mellékmondatban szerepel: ut + coniunctivus.','Venit ut regem videat. – Azért jön, hogy lássa a királyt.','videat','Coniunctivus','Indicativus','Imperativus'],
['Participium','A participium praesens activum egyidejű cselekvést jelöl: legens (olvasó). A participium perfectum passivum általában előidejű: scriptus (megírt).','Litterae scriptae sunt. – A leveleket megírták.','scriptae','Participium perfectum passivum','Infinitivus','Participium praesens activum'],
['Accusativus cum infinitivo','A függő kijelentés alanya accusativusban, állítmánya infinitivusban állhat.','Dicit regem venire. – Azt mondja, hogy a király jön.','regem','Az infinitivus alanya','A főmondat alanya','Határozó'],
['Ablativus absolutus','Önálló ablativusi szerkezet, rendszerint főnév és participium alkotja.','Rege mortuo, bellum coepit. – A király halála után háború kezdődött.','rege mortuo','Ablativus absolutus','Accusativus cum infinitivo','Dativus'],
['Okleveles latin','A királyi adománylevelek gyakori formulái: litterae donationales (adománylevél), nota infidelitatis (hűtlenség vétke), defectus seminis (magvaszakadás).','Rex possessionem nobili donavit. – A király birtokot adományozott a nemesnek.','nobili','Dativus','Nominativus','Genitivus'],
['Diplomáciai latin','A misszilisekben gyakori a megszólítás és a címzés: Maiestas Vestra (Felségtek), litterae Vestrae (leveletek).','Litteras Maiestatis Vestrae accepimus. – Felségtek levelét megkaptuk.','accepimus','Perfectum, többes 1. személy','Praesens, egyes 1. személy','Futurum']];
const vocab='puella:lány;rosa:rózsa;porto:visz;rex:király;regina:királyné;dominus:úr;servus:szolga;terra:föld;bellum:háború;pax:béke;litterae:levél;scribo:ír;lego:olvas;video:lát;audio:hall;venio:jön;do:ad;dono:adományoz;bonus:jó;malus:rossz;manus:kéz;res:dolog;urbs:város;oppidum:mezőváros;castrum:vár;possessio:birtok;curia:udvarház;nobilis:nemes;comes:ispán vagy gróf;comitatus:vármegye;donatio:adomány;consensus:beleegyezés;testimonium:tanúság;utilitas:haszon;infidelitas:hűtlenség;fidelitas:hűség;semen:mag, utód;defectus:hiány;maiestas:felség;episcopus:püspök;frater:testvér, szerzetes;exercitus:hadsereg;captivus:fogoly;obses:túsz;legatus:követ;nuntius:hírnök;foedus:szövetség;sigillum:pecsét;annus:év;dies:nap;filius:fiú;uxor:feleség;heres:örökös;portio:rész;notarius:jegyző;mandatum:parancs;salus:üdv, jólét;gratia:kegyelem;deus:isten;homo:ember;amicus:barát;inimicus:ellenség;pecunia:pénz;aurum:arany;argentum:ezüst;equus:ló;miles:katona;via:út;aqua:víz;ignis:tűz;mons:hegy;flumen:folyó;silva:erdő;domus:ház;urbs:város;populus:nép;lex:törvény;ius:jog;judex:bíró;causa:ügy, ok;verbum:szó;tempus:idő;hodie:ma;heri:tegnap;cras:holnap;semper:mindig;numquam:soha;et:és;sed:de;aut:vagy;quia:mert;ut:hogy;si:ha;cum:amikor, együtt;per:által;ad:-hoz, -hez;ab:-tól, -től;pro:-ért;contra:ellen;inter:között'.split(';').map(x=>x.split(':'));let state;try{state=JSON.parse(localStorage.cattus)||{}}catch{state={}};state={done:[],right:0,total:0,known:[],theme:'',...state};function save(){try{localStorage.cattus=JSON.stringify(state)}catch{}}document.body.className=state.theme;const v=document.querySelector('#view');function nav(){document.querySelector('#nav').innerHTML=['Kezdőlap','Leckék','Szótár','Szókártyák','Kvíz','Statisztika','Beállítások'].map(x=>`<button onclick="go('${x}')">${x}</button>`).join('')}function go(x){if(x==='Kezdőlap')v.innerHTML=`<article><h2>Üdvözöllek!</h2><p>14 lecke a klasszikus és történeti latin alapjaihoz.</p><progress max="14" value="${state.done.length}"></progress><p>${state.done.length}/14 lecke teljesítve</p><button onclick="go('Leckék')">Tanulás indítása</button></article>`;if(x==='Leckék')v.innerHTML=lessons.map((l,i)=>`<article><button onclick="lesson(${i})">${state.done.includes(i)?'✓ ':''}${i+1}. ${l[0]}</button></article>`).join('');if(x==='Szótár'){v.innerHTML='<h2>Latin–magyar szótár</h2><input placeholder="Keresés" oninput="dict(this.value)"><div id="words"></div>';dict('')}if(x==='Szókártyák')flash();if(x==='Kvíz')quiz(Math.floor(Math.random()*lessons.length),false);if(x==='Statisztika')v.innerHTML=`<article><h2>Haladás</h2><p>Leckék: ${state.done.length}/14</p><p>Megjelölt ismert szavak: ${state.known.length}/${vocab.length}</p><p>Helyes válaszok: ${state.right}/${state.total} (${state.total?Math.round(100*state.right/state.total):0}%)</p></article>`;if(x==='Beállítások')v.innerHTML='<h2>Megjelenítés</h2>'+['','dark','ink'].map((t,i)=>`<button onclick="theme('${t}')">${['Világos','Sötét','E-ink'][i]}</button>`).join('')+'<p>A haladás helyben tárolódik, ha a böngésző engedélyezi.</p>'}function theme(t){state.theme=t;document.body.className=t;save()}function dict(q){document.querySelector('#words').innerHTML='<table>'+vocab.filter(w=>w.join(' ').toLowerCase().includes(q.toLowerCase())).map(w=>`<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join('')+'</table>'}function lesson(i){let l=lessons[i];v.innerHTML=`<article><small>${i+1}. lecke</small><h2>${l[0]}</h2><p>${l[1]}</p><p><b>${l[2]}</b></p><button onclick="quiz(${i},true)">Gyakorlás</button></article>`}function quiz(i,learn){let l=lessons[i],opts=l.slice(4).sort(()=>Math.random()-.5);v.innerHTML=`<article><h2>${l[0]}</h2><p>${l[2].split(' – ')[0]}</p><p>Mi a következő alak nyelvtani szerepe vagy besorolása? <b>${l[3]}</b></p>${opts.map(o=>`<button class="answer" onclick="answer(${i},${o===l[4]},${learn})">${o}</button>`).join('')}<div id="feedback"></div></article>`}function answer(i,ok,learn){state.total++;if(ok){state.right++;if(learn&&!state.done.includes(i))state.done.push(i)}save();document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`<p><b>${ok?'Helyes!':'Helytelen. Helyes válasz: '+lessons[i][4]}</b></p><p>${lessons[i][1]}</p><button onclick="${learn?(ok?"go('Leckék')":`quiz(${i},true)`):`quiz(${(i+1)%lessons.length},false)`}">Tovább</button>`}function flash(){let pool=vocab.filter(w=>!state.known.includes(w[0]));if(!pool.length)pool=vocab;let w=pool[Math.floor(Math.random()*pool.length)];v.innerHTML=`<article><h2>${w[0]}</h2><p id="meaning">Gondolj a magyar jelentésre!</p><button onclick="document.querySelector('#meaning').textContent='${w[1]}'">Felfedés</button><button onclick="known('${w[0]}')">Ismerem</button><button onclick="flash()">Következő</button></article>`}function known(w){if(!state.known.includes(w))state.known.push(w);save();flash()}nav();go('Kezdőlap');</script></html>
