name: Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: felis-stable-signing-keystore-v1
      - name: Prepare stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storetype JKS -storepass android -alias androiddebugkey -keypass android -dname "CN=Felis Debug,O=Felis,C=HU" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - run: gradle --no-daemon :app:assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk Felis_Magyar.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Felis_Magyar.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Felis_Magyar.apk | tee permissions.txt
          ! grep -q 'uses-permission:' permissions.txt
      - name: Publish APK to repository downloads
        run: |
          mkdir -p downloads
          cp Felis_Magyar.apk downloads/Felis_Magyar_v1.35.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add downloads/Felis_Magyar_v1.35.apk
          git commit -m "Publish Felis Magyar 1.35 APK"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Felis_Magyar_APK
          path: Felis_Magyar.apk
