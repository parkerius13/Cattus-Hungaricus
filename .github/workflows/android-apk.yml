name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - run: gradle --no-daemon :app:assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk Felis_Magyar.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Felis_Magyar.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Felis_Magyar.apk | tee permissions.txt
          ! grep -q 'uses-permission:' permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Felis_Magyar_APK
          path: Felis_Magyar.apk
