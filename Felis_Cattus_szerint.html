<style>
:root{--bg:#eceff1;--surface:#fff;--ink:#1b2a3a;--muted:#5d6b78;--line:#d3d9de;--accent:#2f7f86;--accent-ink:#fff;--gold:#b9861c;--ok:#2e7d4f;--bad:#b3392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13202b;--surface:#1c2e3c;--ink:#e8eef2;--muted:#9fb0bd;--line:#2d4252;--accent:#58b3ba;--accent-ink:#0e1a22;--gold:#e0b04a;--ok:#5cc08a;--bad:#ee7b6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13202b;--surface:#1c2e3c;--ink:#e8eef2;--muted:#9fb0bd;--line:#2d4252;--accent:#58b3ba;--accent-ink:#0e1a22;--gold:#e0b04a;--ok:#5cc08a;--bad:#ee7b6c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:600 26px Cinzel,Georgia,serif;letter-spacing:.06em;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0}
.streak{font-weight:800;color:var(--gold);text-align:right;font-size:14px}
nav{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px;position:sticky;top:8px;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);font:600 13.5px Nunito,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
.lat{font:600 40px Cinzel,Georgia,serif;margin:0}
.note{color:var(--muted);font-size:15px;margin:8px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:2px solid var(--accent);background:none;color:var(--accent);font:800 16px Nunito,sans-serif;padding:12px;border-radius:12px;cursor:pointer}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:14px}
td.l{font-weight:800}
.tw{overflow-x:auto}
.end{color:var(--accent);font-weight:800}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:20px;font:600 15px Nunito,sans-serif;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 18px Nunito,sans-serif;padding:14px;border-radius:12px;margin-top:10px;cursor:pointer}
